name: little_loaf
description: "Little Loaf Bakery — orders, stock and invoicing"
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # storage — 01-platform/storage
  drift: ^2.34.0
  # The native library comes from package:sqlite3's own build hook, selected
  # by the `hooks:` block at the bottom of this file. The old way — adding
  # sqlite3_flutter_libs and sqlcipher_flutter_libs — is gone: both installed a
  # library called libsqlite3.so, one silently overwrote the other, the plain
  # build won, and `PRAGMA key` became a no-op that left the database in
  # cleartext. sqlcipher_flutter_libs 0.7.0+eol does nothing at all now.
  sqlite3: ^3.5.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # ids & crypto — UUID v7, order-number hashes
  uuid: ^4.5.1
  crypto: ^3.0.6

  # sync & backup — Google Drive, no server
  google_sign_in: ^7.2.0
  googleapis: ^14.0.0
  http: ^1.5.0
  workmanager: ^0.10.0

  # security
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.2

  # messaging & location — wa.me, geo:, app chooser
  url_launcher: ^6.3.1

  # payments

  # notifications — below-threshold, no push server
  timezone: ^0.11.0

  # ui
  intl: ^0.20.2
  collection: ^1.19.1
  go_router: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/brand/

# Builds SQLCipher instead of plain SQLite, so the `PRAGMA key` in
# lib/platform/storage/connection.dart actually encrypts the file. That file
# asserts `PRAGMA cipher_version` at open time, so if this block is ever lost
# the app fails loudly instead of quietly writing cleartext.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
