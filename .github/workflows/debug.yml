name: Debug build

# Every push to main, and on demand. This is the build you install to try
# something out. It cannot affect a release: it never touches the upload key.
#
# It IS signed — every installable APK is. The question is with WHAT. Android
# signs a debug build with ~/.android/debug.keystore, and a bare runner has
# none, so the plugin makes a fresh random one per build. That installs fine
# and runs fine; the only thing it breaks is Google Sign-In, because an OAuth
# client is matched on package name AND signing certificate. Give the runner
# the real debug keystore (ANDROID_DEBUG_KEYSTORE_BASE64) and Drive works here
# too. The earlier wording — "no signing key involved" — was simply wrong.
#
# A push to main bumps the patch version first, so every debug APK carries a
# version that is higher than the last one and the app agrees with its own file
# name. A pull request builds without bumping: the version belongs to main, not
# to a branch that may never land.
#
# Documentation does not build an APK. A push that only touches docs, a README
# or a licence is skipped entirely — no build, and no version bump, because a
# version that moved without the code moving says something untrue. A push that
# touches code *and* docs still builds: paths-ignore only skips when every
# changed file matches.
on:
  push:
    branches: [main]
    paths-ignore: &not-code
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.vscode/**'
      - '.idea/**'
  pull_request:
    branches: [main]
    paths-ignore: *not-code
  workflow_dispatch:
    inputs:
      version:
        description: 'Build at this exact version instead of bumping (e.g. 0.2.0)'
        required: false

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true      # only the newest push is worth building

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to push the version bump back to main

    steps:
      - uses: actions/checkout@v4
        with:
          # The default checkout is a detached HEAD at the pushed sha, which
          # cannot be pushed from. The branch is needed to commit the bump.
          ref: ${{ github.head_ref || github.ref_name }}

      # Bumps the patch and commits it. [skip ci] keeps this from triggering
      # another run of this same workflow, which would bump again, forever.
      #
      # A release calls this workflow with an explicit version instead, so the
      # debug APK and the signed release APK are the same number.
      - name: Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
            echo "building at requested version $V"
          elif [ "${{ github.event_name }}" = "push" ]; then
            V="$(tool/bump_version.sh patch)"
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.yaml lib/platform/versioning/version.dart
            git commit -m "v$V [skip ci]"
            # Another push may have landed while this job was building. Rebase
            # rather than fail: the bump is a one-line change to two files and
            # never conflicts with anything but another bump.
            git pull --rebase --autostash
            git push
          else
            # A pull request: read what is there, change nothing.
            V="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # package:sqlite3 downloads a prebuilt SQLCipher binary per ABI and checks
      # it against a hash baked into the package. On a runner that download is
      # flaky: two consecutive runs failed on DIFFERENT files, and the second
      # fetched the very file the first had failed on. The asset itself is
      # fine — fetched by hand it hashes exactly as the package expects — so
      # what arrives on a bad attempt is a truncated or error body, not a
      # changed artefact.
      #
      # A retry is therefore the whole fix. Anything that downloaded cleanly is
      # cached in .dart_tool/hooks_runner/shared for the rest of the job, so an
      # attempt only ever has to fetch what the last one missed.
      - name: Retry helper
        run: |
          cat > "$RUNNER_TEMP/retry.sh" <<'SH'
          #!/usr/bin/env bash
          for attempt in 1 2 3; do
            if "$@"; then exit 0; fi
            echo "::warning::attempt $attempt failed: $* — retrying"
            sleep $((attempt * 10))
          done
          echo "::error::still failing after 3 attempts: $*"
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/retry.sh"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: "$RUNNER_TEMP/retry.sh" flutter test

      # --split-per-abi, not --target-platform. The latter only filters
      # Flutter's own libraries: SQLCipher arrives from package:sqlite3's build
      # hook, which emits all three ABIs regardless, so --target-platform still
      # ships x86_64 and armeabi-v7a copies of libsqlcipher.so — measured at
      # ~9.6 MB of dead weight. --split-per-abi filters correctly.
      # Without this the runner has no ~/.android/debug.keystore, so the
      # Android plugin generates a fresh random one per build. Android OAuth
      # clients are matched on package name AND signing certificate, so such an
      # APK can never sign in to Google — everything else about it works, but
      # Drive is unreachable and the failure looks like a bug in the app.
      #
      # The keystore arrives as a base64 secret rather than living in the repo:
      # a debug keystore is not a secret in the usual sense (its password is
      # literally "android"), but this repository is public, and a committed
      # one would let anyone sign a package with the bakery's identity.
      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set. The APK will build and run, but it is signed with a throwaway key, so Google Sign-In and therefore Drive sync will not work in it."
            echo "HAS_DEBUG_KEY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "HAS_DEBUG_KEY=true" >> "$GITHUB_ENV"

          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            | grep 'SHA1:' || true

      - name: Build
        run: "$RUNNER_TEMP/retry.sh" flutter build apk --debug --split-per-abi

      # A mismatch here is otherwise found on a phone, as a sign-in that fails
      # with a number. The fingerprint is public — it is what is pasted into
      # the Cloud console — so there is nothing to hide by keeping it out of
      # the workflow, and everything to gain from failing where it is visible.
      - name: Verify it is the registered debug key
        if: ${{ env.HAS_DEBUG_KEY == 'true' }}
        env:
          # The SHA-1 registered for com.littleloaf.little_loaf.debug.
          EXPECTED: 078c6665476636c21db2c891bd88ac204e2089f9
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          GOT=$("$APKSIGNER" verify --print-certs "$APK" \
                | grep -i 'SHA-1 digest' | head -1 \
                | sed 's/.*: *//' | tr -d ' :' | tr 'A-Z' 'a-z')
          echo "signed by : $GOT"
          echo "registered: $EXPECTED"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::This APK is signed by a certificate Google has not been told about, so Drive sign-in will fail in it. Check ANDROID_DEBUG_KEYSTORE_BASE64."
            exit 1
          fi

      # arm64 for real phones and tablets, x86_64 for the emulators. A universal
      # debug APK is ~170 MB and nobody installs the 32-bit one.
      #
      # Named for the version and nothing else. Every push to main moves it, so
      # the version already identifies the build — and it is the one thing you
      # can compare between two files sitting in a downloads folder.
      - name: Name them
        id: stage
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk \
             "dist/little-loaf-debug-$V-arm64.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-debug.apk \
             "dist/little-loaf-debug-$V-x86_64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: little-loaf-debug-${{ steps.version.outputs.version }}
          path: dist/*.apk
          # Debug APKs are large and only interesting while the change is fresh.
          retention-days: 14
          compression-level: 0    # an APK is already a zip
