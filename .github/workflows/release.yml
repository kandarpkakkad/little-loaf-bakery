name: Release

# Tag-driven: pushing v0.1.1 builds and publishes v0.1.1, so the tag is the
# single source of truth for what a release contains. The manual trigger is for
# re-running a failed publish without moving the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.1.1)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to create the release

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Runs before anything is signed or published: a red test must not become
      # a release someone installs.
      - name: Test
        run: flutter test

      # The keystore never lives in the repository. It arrives as a base64
      # secret, is written for the length of this job, and is removed at the end
      # even if the build fails.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — the build would fall back to the debug key and produce an APK that cannot update anyone's install."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build
        run: flutter build apk --release --split-per-abi

      # Proves the artefact is signed by the real key rather than the debug
      # fallback, which is silent and otherwise only noticed by users.
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            echo "── $(basename "$f")"
            "$APKSIGNER" verify --print-certs "$f" | grep -E "certificate DN|SHA-1 digest"
          done
          if "$APKSIGNER" verify --print-certs \
               build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             | grep -qi "CN=Android Debug"; then
            echo "::error::Signed with the DEBUG key — check the keystore secrets."
            exit 1
          fi

      - name: Name the artefacts
        id: stage
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "dist/little-loaf-$VERSION-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/little-loaf-$VERSION-arm32.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.stage.outputs.version }}"
          gh release view "$V" >/dev/null 2>&1 \
            && gh release upload "$V" dist/*.apk --clobber \
            || gh release create "$V" dist/*.apk --title "$V" --generate-notes

      # Runs even when an earlier step failed, so a crashed job never leaves the
      # key on the runner's disk.
      - name: Shred the key
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
