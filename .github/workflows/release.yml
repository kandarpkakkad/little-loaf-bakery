name: Release

# Two ways in, and both end at the same place: one version, built twice — a
# debug APK to try it on and a signed release APK to install.
#
#   Run workflow (minor)   bumps 0.1.7 -> 0.2.0, commits, tags v0.2.0, builds
#   git push v0.2.0        builds the tag exactly as it stands, no bump
#
# The first is the normal path. The second is for re-running a publish that
# failed after the tag was already cut.
on:
  workflow_dispatch:
    inputs:
      level:
        description: 'How far to move the version'
        type: choice
        options: [minor, patch, major]
        default: minor
      version:
        description: 'Or an exact version, e.g. 0.3.0 (overrides the level)'
        required: false
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the release, the tag, and the version bump

    steps:
      - uses: actions/checkout@v4
        with:
          # A dispatch works on main, because it is going to commit the bump
          # there. A tag build checks out the tag and changes nothing.
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - run: flutter --version

      # One number for the whole job. Everything after this — both builds, the
      # file names, the tag and the release — reads it from here, so the debug
      # APK and the signed APK can never be different versions.
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Building an existing tag. The tag is the claim; pubspec has to
            # back it up, or the app would report a version nobody released.
            V="${GITHUB_REF_NAME#v}"
            IN_PUBSPEC="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
            if [ "$V" != "$IN_PUBSPEC" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match pubspec ($IN_PUBSPEC). Cut the tag from a commit where they agree."
              exit 1
            fi
          else
            if [ -n "${{ github.event.inputs.version }}" ]; then
              V="$(tool/bump_version.sh set '${{ github.event.inputs.version }}')"
            else
              V="$(tool/bump_version.sh '${{ github.event.inputs.level }}')"
            fi
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.yaml lib/platform/versioning/version.dart
            git commit -m "v$V [skip ci]"
            git pull --rebase --autostash
            git push
            # Pushed with GITHUB_TOKEN, which deliberately does not trigger
            # another workflow run — so this does not start a second build of
            # itself. [skip ci] above says the same thing out loud.
            git tag "v$V"
            git push origin "v$V"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building v$V"

      - name: Dependencies
        run: flutter pub get

      # package:sqlite3 downloads a prebuilt SQLCipher binary per ABI and checks
      # it against a hash baked into the package. On a runner that download is
      # flaky: two consecutive runs failed on DIFFERENT files, and the second
      # fetched the very file the first had failed on. The asset itself is
      # fine — fetched by hand it hashes exactly as the package expects — so
      # what arrives on a bad attempt is a truncated or error body, not a
      # changed artefact.
      #
      # A retry is therefore the whole fix. Anything that downloaded cleanly is
      # cached in .dart_tool/hooks_runner/shared for the rest of the job, so an
      # attempt only ever has to fetch what the last one missed.
      - name: Retry helper
        run: |
          cat > "$RUNNER_TEMP/retry.sh" <<'SH'
          #!/usr/bin/env bash
          for attempt in 1 2 3; do
            if "$@"; then exit 0; fi
            if [ "$attempt" = 3 ]; then break; fi
            echo "::warning::attempt $attempt failed: $* — retrying"
            sleep $((attempt * 10))
          done
          echo "::error::still failing after 3 attempts: $*"
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/retry.sh"

      - name: Analyze
        run: flutter analyze

      # Runs before anything is signed or published: a red test must not become
      # a release someone installs.
      - name: Test
        run: bash "$RUNNER_TEMP/retry.sh" flutter test

      # --split-per-abi, not --target-platform. The latter only filters
      # Flutter's own libraries: SQLCipher arrives from package:sqlite3's build
      # hook, which emits all three ABIs regardless.
      #
      # The debug build first and unsigned, so a signing problem cannot stop
      # you getting a build of this exact version onto a phone to look at.
      # The release workflow ships a debug APK too, and it is worth as little
      # as the debug workflow's if it cannot sign in. Same key, same reason.
      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set — the debug APK in this release will not be able to sign in to Google."
            echo "HAS_DEBUG_KEY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$DEBUG_KEYSTORE_B64" | base64 --decode > android/debug.keystore
          echo "HAS_DEBUG_KEY=true" >> "$GITHUB_ENV"

      - name: Build debug
        run: |
          "$RUNNER_TEMP/retry.sh" flutter build apk --debug --split-per-abi
          mkdir -p dist/debug
          V="${{ steps.version.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk \
             "dist/debug/little-loaf-debug-$V-arm64.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-debug.apk \
             "dist/debug/little-loaf-debug-$V-x86_64.apk"

      # Before the artefact is offered to anyone. The comment about the
      # keystore's lifetime belongs to the step that writes it, below.
      - name: Verify the debug APK's key
        if: ${{ env.HAS_DEBUG_KEY == 'true' }}
        env:
          EXPECTED: 078c6665476636c21db2c891bd88ac204e2089f9
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs \
                  build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk \
                | grep -i 'SHA-1 digest' | head -1 \
                | sed 's/.*: *//' | tr -d ' :' | tr 'A-Z' 'a-z')
          echo "debug apk signed by : $GOT"
          echo "registered          : $EXPECTED"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::The debug APK in this release is signed by a certificate Google has not been told about, so Drive sign-in will fail in it."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: little-loaf-debug-${{ steps.version.outputs.version }}
          path: dist/debug/*.apk
          retention-days: 14
          compression-level: 0    # an APK is already a zip

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — the build would fall back to the debug key and produce an APK that cannot update anyone's install."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release
        run: bash "$RUNNER_TEMP/retry.sh" flutter build apk --release --split-per-abi

      # Proves the artefact is signed by the real key rather than the debug
      # fallback, which is silent and otherwise only noticed by users.
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            echo "── $(basename "$f")"
            "$APKSIGNER" verify --print-certs "$f" | grep -E "certificate DN|SHA-1 digest"
          done
          if "$APKSIGNER" verify --print-certs \
               build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             | grep -qi "CN=Android Debug"; then
            echo "::error::Signed with the DEBUG key — check the keystore secrets."
            exit 1
          fi

      - name: Name the artefacts
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "dist/little-loaf-v$V-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/little-loaf-v$V-arm32.apk"

      # The update banner and the block screen link to the arm64 asset by name,
      # so the name matters as much as the file.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.version.outputs.version }}"
          gh release view "$V" >/dev/null 2>&1 \
            && gh release upload "$V" dist/*.apk --clobber \
            || gh release create "$V" dist/*.apk --title "$V" --generate-notes

      # Two APKs a release, ~50 MB a pair, and a release every push to main
      # that asks for one. GitHub keeps them for ever and counts them against
      # the repository, so this trims the tail.
      #
      # The releases themselves stay — tag, title and notes — and so does the
      # history. Only the binaries go, and only from the eleventh newest
      # onwards. Ten is far more than anyone rolls back through; the source for
      # any older version is still there under its tag.
      #
      # publishedAt, not createdAt: a release's createdAt is the date of the
      # COMMIT its tag points at, so tagging an old commit would file a new
      # release among the ancient ones and prune it immediately.
      - name: Keep the APKs of the last ten releases only
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 10
        run: |
          stale=$(gh release list --limit 200 --json tagName,publishedAt \
                    --jq "sort_by(.publishedAt) | reverse | .[$KEEP:] | .[].tagName")

          if [ -z "$stale" ]; then
            echo "$(gh release list --limit 200 --json tagName --jq 'length') releases, none older than the newest $KEEP. Nothing to prune."
            exit 0
          fi

          failed=0
          for tag in $stale; do
            for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              if gh release delete-asset "$tag" "$asset" --yes; then
                echo "removed $tag/$asset"
              else
                echo "::warning::could not remove $tag/$asset"
                failed=1
              fi
            done
          done

          # The release is already published by this point, so a prune that
          # fails costs nothing but disk. Say so rather than going quietly.
          if [ "$failed" = 1 ]; then
            echo "::error::Some old release assets could not be removed. The release itself published fine — this is only cleanup, and it needs contents:write."
            exit 1
          fi

      # Runs even when an earlier step failed, so a crashed job never leaves the
      # key on the runner's disk.
      - name: Shred the keys
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties android/debug.keystore
